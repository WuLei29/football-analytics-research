[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "football-analytics"
version = "0.1.0"
description = "Football eventing data processing and analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"

# Core dependencies — everything needed to run the pipeline and analysis
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "xgboost>=1.7",
    # Every loader, gold build and export connects with psycopg2 and reads
    # FOOTBALL_DB_DSN from .env. The venv has the source build `psycopg2`;
    # either distribution satisfies `import psycopg2`.
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    # xg.py loads the Platt calibrator, a pickled sklearn LogisticRegression.
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# Install with: pip install -e ".[dev]" or pip install -e ".[dev,viz]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# Development tools — testing, notebooks, linting
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter>=1.0",
    "ipykernel",
    "black",
    "ruff",
    "soccer_xg",
    "socceraction",
]

# Extended visualization libs — add as your project grows
viz = [
    "mplsoccer>=1.1",   # Football-specific pitch plotting
    "plotly>=5.0",
]

# Scraper — browser automation for downloading Opta event files
scraper = [
    "playwright>=1.40",
]

# ---------------------------------------------------------------------------
# Tell setuptools where to find your package (the src/ layout)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Black formatter config
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py310"]

# ---------------------------------------------------------------------------
# Ruff linter config (fast replacement for flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
ignore = []

# ---------------------------------------------------------------------------
# Pytest config
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

